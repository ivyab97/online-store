<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | Online Store</title>

    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Estilos de la vista Productos -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/pageButton.css">

    <!-- Modal de errores de API -->
    <link rel="stylesheet" href="../css/alertModal.css">
</head>


<body>

    <header id="header"></header>


    <main>

        <!-- =========================
             PRESENTACIÓN
        ========================== -->

        <section class="products-hero">

            <div class="products-hero__content">

                <h1>PRODUCTOS</h1>

                <p>
                    Buscá y explorá productos disponibles
                    en nuestro catálogo.
                </p>

            </div>

        </section>


        <!-- =========================
             BÚSQUEDA Y FILTROS
        ========================== -->

        <section
            class="search-section"
            aria-labelledby="search-title"
        >

            <div class="search-container">

                <h2 id="search-title">
                    Buscar productos
                </h2>


                <form
                    id="search-form"
                    class="search-form"
                    autocomplete="off"
                >

                    <!-- Nombre -->

                    <div class="form-field">

                        <label for="search">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="search"
                            name="search"
                            placeholder="Ej: perfume, celular, laptop..."
                        >

                    </div>


                    <!-- Categoría -->

                    <div class="form-field">

                        <label for="category-filter">
                            Categoría
                        </label>

                        <select
                            id="category-filter"
                            name="category"
                        >
                            <option value="">
                                Todas las categorías
                            </option>
                        </select>

                    </div>


                    <!-- Precio mínimo -->

                    <div class="form-field">

                        <label for="min-price">
                            Precio mínimo
                        </label>

                        <input
                            type="number"
                            id="min-price"
                            name="minPrice"
                            min="0"
                            step="0.01"
                            placeholder="0"
                        >

                    </div>


                    <!-- Precio máximo -->

                    <div class="form-field">

                        <label for="max-price">
                            Precio máximo
                        </label>

                        <input
                            type="number"
                            id="max-price"
                            name="maxPrice"
                            min="0"
                            step="0.01"
                            placeholder="Sin límite"
                        >

                    </div>


                    <!-- Buscar -->

                    <button
                        type="submit"
                        id="search-button"
                        class="search-button"
                    >
                        Buscar
                    </button>

                </form>

            </div>

        </section>


        <!-- =========================
             RESULTADOS
        ========================== -->

        <section
            class="results-section"
            aria-labelledby="results-title"
        >

            <div class="results-container">

                <div class="results-header">

                    <h2 id="results-title">
                        Resultados
                    </h2>

                    <p
                        id="results-status"
                        class="results-status"
                        aria-live="polite"
                    ></p>

                </div>


                <!--
                    Los productos serán renderizados
                    dinámicamente desde DummyJSON.
                -->

                <div
                    id="product-results"
                    class="products-grid"
                ></div>


                <!-- Paginación -->

                <nav
                    id="pagination"
                    class="pagination"
                    aria-label="Paginación de productos"
                ></nav>

            </div>

        </section>

    </main>


    <footer
        class="footer"
        id="footer"
    ></footer>


    <script
        type="module"
        src="../js/index.js"
    ></script>

</body>

</html>
